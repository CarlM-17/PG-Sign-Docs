<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PG Docs Sign - Login</title>
<link rel="stylesheet" href="/css/style.css">
</head>
<body>
<div class="center">
  <div class="card">
    <h1 id="formTitle">Sign in to PG Docs Sign</h1>
    <p class="subtitle" id="formSubtitle">Enter your credentials to continue.</p>

    <div id="msg"></div>

    <form id="authForm">
      <div class="form-group" id="nameGroup" style="display:none">
        <label>Full name</label>
        <input type="text" id="fullName" placeholder="e.g. Juan Dela Cruz">
      </div>
      <div class="form-group" id="storeSelectGroup" style="display:none">
        <label>Select your store *</label>
        <select id="storeSelect">
          <option value="">Loading stores...</option>
        </select>
      </div>
      <div class="form-group">
        <label>Email</label>
        <input type="email" id="email" required placeholder="you@example.com">
      </div>
      <div class="form-group">
        <label>Password</label>
        <input type="password" id="password" required minlength="6" placeholder="At least 6 characters">
      </div>
      <button type="submit" class="btn-full" id="submitBtn">Sign in</button>
    </form>

    <p style="text-align:center; margin-top:16px; font-size:13px;">
      <span id="switchText">New here?</span>
      <a href="#" class="link" id="switchLink">Create an account</a>
    </p>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="/js/config.js?v=3"></script>
<script src="/js/auth.js?v=3"></script>
</body>
</html>
