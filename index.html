<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
<meta name="theme-color" content="#0d5c2f">
<title>PG Docs Sign</title>
<link rel="manifest" href="/manifest.json">
<link rel="icon" href="/SignDocs_icon.png">
<link rel="apple-touch-icon" href="/SignDocs_icon.png">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@600&display=swap" rel="stylesheet">
<style>
  :root {
    --green-900:#064e3b; --green-700:#0d5c2f; --green-500:#10b981; --green-100:#d1fadf; --green-50:#f0fdf4;
    --gold:#c9a227; --gold-light:#f7e08a;
    --bg:#f6f9f6; --card:#fff; --text:#0f172a; --muted:#64748b; --border:#e5e7eb;
    --red:#dc2626; --amber:#f59e0b; --blue:#2563eb;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body { overscroll-behavior-y: contain; overscroll-behavior-x: contain; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; -webkit-font-smoothing: antialiased; }
  .container { width: 100%; max-width: none; margin: 0; padding: 16px 24px; }
  .center { display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 12px; }
  /* Corporate header - dark green, clean */
  .header { background: linear-gradient(180deg, var(--green-900) 0%, var(--green-700) 100%); border-bottom: 3px solid var(--gold); padding: 12px 18px; box-shadow: 0 4px 12px rgba(6,78,59,0.25); position: relative; }
  .header-row1 { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
  .brand { display: flex; align-items: center; gap: 12px; }
  .brand img { width: 48px; height: 48px; border-radius: 24px; box-shadow: 0 2px 8px rgba(0,0,0,0.35); border: 2px solid var(--gold); background: #fff; object-fit: cover; }
  .brand-text { display: flex; flex-direction: column; line-height: 1.15; }
  .brand-text .title { font-size: 20px; font-weight: 800; color: #fff; letter-spacing: .5px; text-shadow: 0 1px 2px rgba(0,0,0,0.2); }
  .brand-text .subtitle { font-size: 11px; color: var(--gold-light); font-weight: 700; text-transform: uppercase; letter-spacing: 1.5px; margin-top: 2px; }
  .header-user { margin-top: 6px; font-size: 13px; color: #fff; display: flex; flex-direction: column; gap: 2px; align-items: flex-start; }
  .header-user .uname { font-weight: 700; font-size: 15px; color: #fff; display: flex; align-items: center; gap: 8px; cursor: pointer; }
  .header-user .uname svg { flex-shrink: 0; }
  .header-user .uname:hover .edit-icon { opacity: 1; }
  .header-user .edit-icon { opacity: 0.5; font-size: 11px; color: var(--gold-light); }
  .header-user .ustore { font-size: 12px; color: var(--gold-light); font-weight: 600; margin-left: 26px; }
  .menu-btn { background: rgba(255,255,255,0.15); color: #fff; border: 1px solid rgba(255,255,255,0.3); width: 40px; height: 40px; border-radius: 20px; padding: 0; font-size: 18px; cursor: pointer; display: flex; align-items: center; justify-content: center; }
  .menu-btn:hover { background: rgba(255,255,255,0.25); }
  .menu-drop { position: absolute; top: 100%; right: 12px; margin-top: 6px; background: #fff; border-radius: 10px; box-shadow: 0 6px 20px rgba(0,0,0,0.15); overflow: hidden; z-index: 100; min-width: 170px; border: 1px solid var(--border); }
  .menu-drop button { display: flex; width: 100%; padding: 12px 16px; background: #fff; color: var(--text); border: none; text-align: left; font-size: 14px; align-items: center; gap: 10px; cursor: pointer; }
  .menu-drop button:hover { background: var(--green-50); color: var(--green-900); }
  .menu-drop hr { border: none; border-top: 1px solid var(--border); margin: 0; }
  /* Card */
  .card { background: var(--card); border-radius: 12px; padding: 20px; box-shadow: 0 2px 12px rgba(6,78,59,0.06); border: 1px solid rgba(13,92,47,0.08); }
  .card h1 { font-size: 20px; margin-bottom: 6px; color: var(--green-900); }
  .card .subtitle { color: var(--muted); font-size: 13px; margin-bottom: 20px; }
  .login-card { width: 100%; max-width: 440px; }
  .login-header { text-align: center; margin-bottom: 20px; }
  .login-header img { width: 80px; height: 80px; border-radius: 40px; box-shadow: 0 4px 16px rgba(13,92,47,0.2); margin-bottom: 12px; }
  .login-header h1 { color: var(--green-900); font-size: 24px; font-weight: 800; letter-spacing: .5px; }
  .login-header .tag { color: var(--gold); font-size: 12px; font-weight: 700; letter-spacing: 2px; text-transform: uppercase; }
  /* Form */
  .form-group { margin-bottom: 14px; }
  label { display: block; font-size: 13px; font-weight: 600; margin-bottom: 6px; color: #374151; }
  input, select, textarea { width: 100%; padding: 11px 12px; border: 1px solid #d1d5db; border-radius: 8px; font-size: 14px; font-family: inherit; background: #fff; transition: all .15s; }
  input:focus, select:focus, textarea:focus { outline: none; border-color: var(--green-700); box-shadow: 0 0 0 3px rgba(13,92,47,0.1); }
  button, .btn { background: var(--green-700); color: #fff; border: none; padding: 10px 18px; border-radius: 8px; font-size: 14px; font-weight: 600; cursor: pointer; transition: all .15s; }
  button:hover { background: var(--green-900); transform: translateY(-1px); box-shadow: 0 3px 8px rgba(13,92,47,0.2); }
  button.secondary { background: #f1f5f9; color: #334155; }
  button.secondary:hover { background: #e2e8f0; box-shadow: none; }
  button.danger { background: var(--red); }
  button.danger:hover { background: #b91c1c; }
  button.gold { background: linear-gradient(135deg, var(--gold) 0%, #a5811d 100%); }
  button:disabled { background: #9ca3af; cursor: not-allowed; transform: none; box-shadow: none; }
  .btn-full { width: 100%; padding: 12px; font-size: 15px; }
  .link { color: var(--green-700); text-decoration: none; font-size: 13px; cursor: pointer; font-weight: 600; }
  .link:hover { text-decoration: underline; }
  .msg { padding: 11px 14px; border-radius: 8px; font-size: 13px; margin-bottom: 12px; }
  .msg.error { background: #fef2f2; color: #b91c1c; border: 1px solid #fecaca; }
  .msg.success { background: #f0fdf4; color: #065f46; border: 1px solid #bbf7d0; }
  .msg.info { background: #eff6ff; color: #1e40af; border: 1px solid #bfdbfe; }
  .msg.warn { background: #fffbeb; color: #92400e; border: 1px solid #fde68a; }
  /* KPI cards */
  .kpi-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 14px; margin-bottom: 20px; }
  .kpi { background: var(--card); border-radius: 12px; padding: 16px; border-left: 4px solid var(--green-700); box-shadow: 0 2px 8px rgba(6,78,59,0.05); }
  .kpi.gold { border-left-color: var(--gold); }
  .kpi.red { border-left-color: var(--red); }
  .kpi.blue { border-left-color: var(--blue); }
  .kpi .label { font-size: 11px; color: var(--muted); text-transform: uppercase; font-weight: 600; letter-spacing: .5px; }
  .kpi .value { font-size: 26px; font-weight: 800; color: var(--green-900); margin-top: 4px; }
  .kpi .sub { font-size: 12px; color: var(--muted); margin-top: 2px; }
  /* Tabs */
  .tabs { display: flex; gap: 2px; border-bottom: 2px solid var(--border); margin-bottom: 16px; overflow-x: auto; background: #fff; border-radius: 10px 10px 0 0; padding: 0 8px; }
  .tab { padding: 12px 18px; cursor: pointer; border-bottom: 3px solid transparent; font-size: 14px; color: var(--muted); white-space: nowrap; font-weight: 500; margin-bottom: -2px; }
  .tab.active { color: var(--green-700); border-color: var(--green-700); font-weight: 700; }
  .tab:hover:not(.active) { color: var(--green-900); background: var(--green-50); }
  /* Table with horizontal scroll wrapper */
  .table-scroll { overflow-x: auto; -webkit-overflow-scrolling: touch; max-width: 100%; border-radius: 10px; box-shadow: 0 2px 8px rgba(6,78,59,0.05); margin-bottom: 12px; background: var(--card); }
  .table-scroll::-webkit-scrollbar { height: 8px; }
  .table-scroll::-webkit-scrollbar-track { background: #f1f5f9; border-radius: 4px; }
  .table-scroll::-webkit-scrollbar-thumb { background: var(--green-700); border-radius: 4px; }
  .table-scroll::-webkit-scrollbar-thumb:hover { background: var(--green-900); }
  table { width: 100%; border-collapse: collapse; background: var(--card); min-width: 600px; }
  th, td { padding: 12px 14px; text-align: left; font-size: 14px; vertical-align: top; }
  th { background: var(--green-900); color: #fff; font-weight: 600; font-size: 12px; text-transform: uppercase; letter-spacing: .5px; }
  tr { border-top: 1px solid #f1f5f9; }
  tr:hover td { background: var(--green-50); }
  .badge { display: inline-block; padding: 3px 10px; border-radius: 12px; font-size: 11px; font-weight: 700; text-transform: uppercase; }
  .badge.pending { background: #fef3c7; color: #92400e; }
  .badge.approved { background: #d1fae5; color: #065f46; }
  .badge.rejected { background: #fee2e2; color: #991b1b; }
  .badge.urgent { background: #fee2e2; color: #991b1b; }
  .badge.high { background: #ffedd5; color: #9a3412; }
  .badge.normal { background: #dbeafe; color: #1e40af; }
  .badge.low { background: #f3f4f6; color: #374151; }
  .age-badge { display: inline-block; padding: 3px 8px; border-radius: 10px; font-size: 11px; font-weight: 700; }
  .age-badge.fresh { background: #d1fadf; color: #065f46; }
  .age-badge.warm { background: #fef3c7; color: #92400e; }
  .age-badge.hot { background: #fed7aa; color: #9a3412; }
  .age-badge.critical { background: #fecaca; color: #991b1b; }
  .actions { display: flex; gap: 6px; flex-wrap: wrap; }
  .actions button { padding: 6px 12px; font-size: 12px; }
  .empty { text-align: center; padding: 40px; color: #9ca3af; font-size: 14px; }
  /* Multi-store picker */
  .store-picker { max-height: 210px; overflow-y: auto; border: 1px solid #d1d5db; border-radius: 8px; padding: 6px; background: #fff; }
  .store-picker::-webkit-scrollbar { width: 8px; }
  .store-picker::-webkit-scrollbar-thumb { background: var(--green-700); border-radius: 4px; }
  .store-opt { display: flex; align-items: center; gap: 10px; padding: 8px 10px; border-radius: 6px; cursor: pointer; font-size: 14px; }
  .store-opt:hover { background: var(--green-50); }
  .store-opt input { width: auto; margin: 0; flex-shrink: 0; width: 18px; height: 18px; accent-color: var(--green-700); }
  .store-opt span { color: var(--text); }
  .store-chips { display: flex; flex-wrap: wrap; gap: 4px; }
  .store-chip { background: var(--green-100); color: var(--green-900); border: 1px solid var(--green-500); border-radius: 10px; padding: 2px 8px; font-size: 11px; font-weight: 600; white-space: nowrap; }
  .req-row { display: flex; justify-content: space-between; align-items: center; gap: 10px; margin-top: 8px; padding: 8px 12px; border-radius: 8px; font-size: 13px; flex-wrap: wrap; }
  .req-row.pending { background: #fffbeb; border: 1px solid #fde68a; color: #78350f; }
  .req-row.rejected { background: #fef2f2; border: 1px solid #fecaca; color: #991b1b; }
  .req-row button { padding: 4px 10px; font-size: 11px; }
  /* Remarks */
  .remarks-cell { min-width: 220px; max-width: 300px; }
  .remark-box { background: #fffbeb; border: 1px solid #fde68a; border-left: 3px solid var(--gold); border-radius: 6px; padding: 8px 10px; }
  .remark-text { font-size: 13px; color: #78350f; white-space: pre-wrap; word-break: break-word; }
  .remark-meta { font-size: 10px; color: #a16207; margin-top: 4px; }
  .remark-actions { display: flex; gap: 4px; margin-top: 6px; }
  .remark-actions button { padding: 3px 8px; font-size: 11px; }
  .staff-remark { background: #fffbeb; border: 1px solid #fde68a; border-left: 3px solid var(--gold); border-radius: 6px; padding: 8px 10px; margin-top: 6px; font-size: 12px; color: #78350f; white-space: pre-wrap; }
  /* Positions, categories, date stamps */
  .pos-chip { display: inline-block; padding: 3px 10px; border-radius: 10px; font-size: 11px; font-weight: 700; background: #e0e7ff; color: #3730a3; white-space: nowrap; }
  .pos-chip.store_officer { background: #d1fadf; color: #065f46; }
  .pos-chip.area_manager { background: #ede9fe; color: #5b21b6; }
  .pos-chip.regional_manager { background: #fef3c7; color: #78350f; }
  .cat-chip { display: inline-block; padding: 3px 10px; border-radius: 10px; font-size: 11px; font-weight: 700; white-space: nowrap; }
  .cat-chip.admin { background: #dbeafe; color: #1e40af; }
  .cat-chip.ops { background: #d1fadf; color: #065f46; }
  .stamps { font-size: 11px; color: var(--muted); line-height: 1.7; white-space: nowrap; }
  .stamps span { display: inline-block; min-width: 66px; font-weight: 700; color: var(--green-900); }
  .folder-group.subfolder { margin: 10px 12px; border-color: var(--green-100); }
  .folder-group.subfolder > .folder-head { background: #fff; }
  .folder-group.subfolder > .folder-head:hover { background: var(--green-50); }
  /* Staff dashboard charts */
  .stack-bar { display: flex; height: 26px; border-radius: 13px; overflow: hidden; background: #f1f5f9; }
  .stack-bar.sm { height: 10px; border-radius: 5px; }
  .stack-seg { height: 100%; }
  .chart-legend { display: flex; gap: 16px; flex-wrap: wrap; margin-top: 12px; font-size: 13px; color: var(--text); }
  .chart-legend span { display: inline-flex; align-items: center; gap: 6px; }
  .chart-legend i { width: 12px; height: 12px; border-radius: 3px; display: inline-block; }
  .chart-legend strong { color: var(--green-900); }
  .title-mix { min-width: 120px; }
  /* Announcements and messages */
  .ann-toolbar { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-bottom: 14px; flex-wrap: wrap; }
  .post-list { display: flex; flex-direction: column; gap: 10px; }
  .post-card { background: var(--card); border-radius: 0 12px 12px 0; border-left: 5px solid var(--green-700); padding: 14px 16px; box-shadow: 0 2px 8px rgba(6,78,59,0.06); cursor: pointer; transition: box-shadow .15s; }
  .post-card:hover { box-shadow: 0 4px 16px rgba(6,78,59,0.14); }
  .post-card.unread { background: #fffdf5; }
  .post-card.unread .post-title { font-weight: 800; }
  .post-card-top { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .post-type { font-size: 11px; font-weight: 700; padding: 3px 10px; border-radius: 10px; text-transform: uppercase; letter-spacing: .3px; }
  .post-date { margin-left: auto; font-size: 12px; color: var(--muted); }
  .unread-dot { background: var(--red); color: #fff; font-size: 10px; font-weight: 700; padding: 2px 8px; border-radius: 10px; }
  .post-title { font-size: 15px; font-weight: 700; color: var(--green-900); margin-top: 8px; word-break: break-word; }
  .post-snippet { font-size: 13px; color: #4b5563; margin-top: 4px; white-space: pre-wrap; word-break: break-word; }
  .post-meta { display: flex; gap: 12px; flex-wrap: wrap; align-items: center; margin-top: 10px; font-size: 12px; color: var(--muted); }
  .ack-pill { background: #f0fdf4; color: #065f46; border: 1px solid #bbf7d0; padding: 2px 8px; border-radius: 10px; font-weight: 600; }
  .post-full { background: var(--card); border-radius: 12px; border-top: 5px solid var(--green-700); padding: 18px 20px; box-shadow: 0 2px 12px rgba(6,78,59,0.08); margin-bottom: 14px; }
  .post-full-title { font-size: 20px; color: var(--green-900); margin: 10px 0 4px; word-break: break-word; }
  .post-author { font-size: 12px; color: var(--muted); margin-bottom: 12px; }
  .post-body { font-size: 14.5px; color: #1f2937; line-height: 1.7; white-space: pre-wrap; word-break: break-word; }
  .post-admin-actions { display: flex; gap: 8px; margin-top: 14px; }
  .ack-btn { margin-top: 14px; padding: 10px 22px; font-size: 15px; }
  .ack-done { margin-top: 14px; background: #f0fdf4; border: 1px solid #bbf7d0; color: #065f46; padding: 10px 14px; border-radius: 8px; font-size: 13px; font-weight: 600; }
  .ack-panel { background: var(--card); border-radius: 12px; padding: 14px 16px; margin-bottom: 14px; box-shadow: 0 2px 8px rgba(6,78,59,0.05); }
  .ack-head { font-size: 14px; color: var(--green-900); margin-bottom: 10px; }
  .ack-cols { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .ack-cols > div { display: flex; flex-wrap: wrap; gap: 4px; align-content: flex-start; }
  .ack-label { width: 100%; font-size: 11px; font-weight: 700; color: var(--muted); text-transform: uppercase; margin-bottom: 4px; }
  .store-chip.waiting { background: #fef3c7; border-color: #f59e0b; color: #78350f; }
  .ack-none { font-size: 12px; color: var(--muted); }
  .thread { background: var(--card); border-radius: 12px; padding: 16px; box-shadow: 0 2px 8px rgba(6,78,59,0.05); }
  .thread-head { font-size: 15px; color: var(--green-900); margin-bottom: 12px; display: flex; flex-wrap: wrap; align-items: baseline; gap: 8px; }
  .thread-head span { font-size: 11px; color: var(--muted); font-weight: 500; }
  .reply { border: 1px solid var(--border); border-radius: 10px; padding: 10px 12px; margin-bottom: 10px; background: #fff; }
  .reply.signer { background: #f0fdf4; border-color: #bbf7d0; }
  .reply.mine { border-color: var(--green-500); }
  .reply-head { display: flex; gap: 10px; align-items: center; }
  .reply-avatar { width: 32px; height: 32px; border-radius: 16px; background: var(--green-700); color: #fff; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 14px; flex-shrink: 0; }
  .reply.signer .reply-avatar { background: var(--gold); color: #1a1a1a; }
  .reply-name { font-size: 13px; font-weight: 700; color: var(--green-900); }
  .signer-tag { background: var(--gold); color: #1a1a1a; font-size: 10px; padding: 1px 6px; border-radius: 8px; margin-left: 4px; }
  .reply-sub { font-size: 11px; color: var(--muted); }
  .reply-body { font-size: 14px; color: #1f2937; margin-top: 8px; white-space: pre-wrap; word-break: break-word; line-height: 1.6; }
  .reply-actions { display: flex; gap: 6px; margin-top: 8px; }
  .reply-actions button { padding: 3px 10px; font-size: 11px; }
  .reply-composer { border-top: 1px solid var(--border); padding-top: 12px; margin-top: 6px; }
  .reply-composer-actions { display: flex; justify-content: space-between; align-items: center; gap: 8px; margin-top: 8px; flex-wrap: wrap; }
  .att-picker { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .att-picker button { padding: 6px 12px; font-size: 12px; }
  .att-picked { font-size: 12px; color: var(--muted); word-break: break-all; }
  .att-list { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
  .att-thumb { padding: 0; width: 96px; height: 96px; border-radius: 8px; overflow: hidden; background: #f1f5f9; border: 1px solid var(--border); }
  .att-thumb:hover { transform: none; box-shadow: 0 2px 8px rgba(0,0,0,0.15); background: #f1f5f9; }
  .att-thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .att-file { background: #f1f5f9; color: var(--green-900); border: 1px solid var(--border); padding: 6px 12px; font-size: 12px; }
  .att-file:hover { background: var(--green-50); }
  .post-type-picker { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 12px; }
  .ptype { display: inline-flex; gap: 6px; align-items: center; margin: 0; padding: 6px 12px; border-radius: 16px; border: 2px solid var(--border); font-size: 13px; cursor: pointer; background: #fff; color: var(--text); }
  .ptype input { display: none; }
  .ptype.active { border-color: var(--pc); background: var(--pb); color: var(--pc); font-weight: 700; }
  .aud-picker { display: flex; flex-direction: column; gap: 6px; }
  .aud-picker label { display: flex; gap: 8px; align-items: center; font-weight: 500; margin: 0; }
  .aud-picker input { width: auto; }
  .popover.wide { width: 560px; max-height: 86vh; top: 50%; bottom: auto; transform: translate(-50%, -50%); }
  @media (max-width: 720px) {
    .ack-cols { grid-template-columns: 1fr; }
    .post-date { margin-left: 0; width: 100%; }
  }
  /* To-do and notes */
  .privacy-note { display: flex; gap: 10px; align-items: flex-start; background: var(--green-50); border: 1px solid var(--green-100); border-left: 4px solid var(--green-700); border-radius: 0 8px 8px 0; padding: 10px 14px; margin-bottom: 16px; font-size: 13px; color: var(--green-900); line-height: 1.5; }
  .privacy-note strong { color: var(--green-700); }
  .privacy-icon { font-size: 16px; line-height: 1.3; flex-shrink: 0; }
  .todo-form { display: grid; grid-template-columns: minmax(0, 1fr) 160px 120px auto; gap: 8px; }
  .todo-filters { display: flex; gap: 6px; margin-bottom: 10px; }
  .todo-filters button { padding: 6px 16px; font-size: 12px; }
  .todo-list { background: var(--card); border-radius: 10px; box-shadow: 0 2px 8px rgba(6,78,59,0.05); overflow: hidden; }
  .todo-row { display: flex; align-items: center; gap: 12px; padding: 12px 14px; border-top: 1px solid #f1f5f9; }
  .todo-row:first-child { border-top: none; }
  .todo-row input[type=checkbox] { width: 20px; height: 20px; flex-shrink: 0; accent-color: var(--green-700); cursor: pointer; }
  .todo-main { flex: 1; min-width: 0; }

// Keep the active tab visible in horizontally scrolling tab bars (they reset on re-render)
function centerActiveTabs() {
  requestAnimationFrame(() => {
    document.querySelectorAll('.tabs').forEach(bar => {
      const active = bar.querySelector('.tab.active');
      if (!active) return;
      const barRect = bar.getBoundingClientRect();
      const tabRect = active.getBoundingClientRect();
      bar.scrollLeft += (tabRect.left - barRect.left) - (barRect.width - tabRect.width) / 2;
    });
  });
}

async function route() {
  const { data: { session } } = await sb.auth.getSession();
  if (!session) { authMode = 'login'; return renderAuth(); }
  const { data: profile } = await sb.from('pgds_profiles').select('*').eq('id', session.user.id).single();
  if (!profile) { await sb.auth.signOut(); return renderAuth(); }
  if (profile.status !== 'approved') {
    await sb.auth.signOut(); authMode = 'login'; renderAuth();
    showMsg('authMsg', profile.status === 'rejected' ? 'Your account was not approved. Reason: ' + (profile.reject_reason || 'not specified') : 'Your account is still awaiting admin approval.', profile.status === 'rejected' ? 'error' : 'info');
    return;
  }
  currentUser = { id: session.user.id, email: session.user.email, ...profile };
  // Load every store this user is allowed to upload for
  currentUser.stores = await loadMyStores(session.user.id, profile);
  if (profile.role === 'admin') renderAdmin(); else { renderStaff(); showTodoReminder(); showMessageReminder(); }
}

async function loadMyStores(userId, profile) {
  const { data } = await sb.from('pgds_user_stores')
    .select('store_id, pgds_stores(id, store_number, store_name, active)')
    .eq('user_id', userId);
  const list = (data || [])
    .map(r => r.pgds_stores)
    .filter(s => s && s.active !== false)
    .sort((a, b) => String(a.store_number).localeCompare(String(b.store_number), undefined, { numeric: true }));
  // Fall back to the profile's single store if no assignments exist yet
  if (!list.length && profile.store_number) {
    return [{ id: null, store_number: profile.store_number, store_name: profile.store_name || '' }];
  }
  return list;
}

async function handleAuth(e) {
  e.preventDefault();
  const email = document.getElementById('email').value.trim();
  const password = document.getElementById('password').value;
  const btn = document.getElementById('submitBtn'); btn.disabled = true;
  try {
    if (authMode === 'signup') {
      const fullName = document.getElementById('fullName').value.trim();
      const position = document.getElementById('signupPosition').value;
      const picked = Array.from(document.querySelectorAll('#storePicker input:checked'));
      if (!picked.length) throw new Error(position === 'area_manager' ? 'Please tick the stores under you.' : 'Please tick at least one store.');
      const { data, error } = await sb.auth.signUp({ email, password, options: { data: { full_name: fullName } } });
      if (error) throw error;
      if (data.user) {
        // Primary store = the first one ticked (used for display)
        await sb.from('pgds_profiles').update({
          full_name: fullName,
          position,
          store_number: picked[0].dataset.num,
          store_name: picked[0].dataset.name
        }).eq('id', data.user.id);
        await sb.from('pgds_user_stores').insert(
          picked.map(p => ({ user_id: data.user.id, store_id: p.value }))
        );
      }
      showMsg('authMsg', `Account created for ${picked.length} store(s)! Waiting for admin approval.`, 'success');
    } else {
      const { data, error } = await sb.auth.signInWithPassword({ email, password });
      if (error) throw error;
      await route();
    }
  } catch (err) { showMsg('authMsg', err.message || 'Error', 'error'); }
  finally { btn.disabled = false; }
}

// ---- Attachments ----
async function uploadAttachments(fileList) {
  const out = [];
  for (const f of Array.from(fileList || [])) {
    if (f.size > MAX_ATTACH_MB * 1048576) { toast(`${f.name} is over ${MAX_ATTACH_MB}MB and was skipped.`, 'warn'); continue; }
    const isPdf = f.type === 'application/pdf' || /\.pdf$/i.test(f.name);
    const isImg = /^image\//i.test(f.type);
    if (!isImg && !isPdf) { toast(`${f.name}: only photos and PDFs can be attached.`, 'warn'); continue; }
    let body = f, type = isPdf ? 'application/pdf' : f.type, name = f.name;
    if (isImg) {
      try {
        const c = await compressImage(f, 2400, 0.88);
        body = new Blob([c.bytes], { type: 'image/jpeg' }); type = 'image/jpeg';
        name = name.replace(/\.[^.]+$/, '') + '.jpg';
      } catch (e) { /* keep original */ }
    }
    const safe = name.replace(/[^a-zA-Z0-9._-]/g, '_').slice(-60);
    const path = `${currentUser.id}/${Date.now()}-${Math.random().toString(36).slice(2, 8)}-${safe}`;
    const { error } = await sb.storage.from(ATTACH_BUCKET).upload(path, body, { contentType: type });
    if (error) { toast(`Could not attach ${f.name}: ${error.message}`, 'error'); continue; }
    out.push({ path, name, type, size: body.size });
  }
  return out;
}

async function hydrateAttachmentThumbs(root) {
  const imgs = Array.from((root || document).querySelectorAll('img[data-att-path]:not([src])'));
  if (!imgs.length) return;
  const paths = [...new Set(imgs.map(i => i.dataset.attPath))];
  const { data } = await sb.storage.from(ATTACH_BUCKET).createSignedUrls(paths, 3600);
  const map = {};
  (data || []).forEach(d => { if (d.signedUrl) map[d.path] = d.signedUrl; });
  imgs.forEach(i => { if (map[i.dataset.attPath]) i.src = map[i.dataset.attPath]; });
}
function removeAttachmentFiles(list) {
  const paths = (list || []).map(a => a.path).filter(Boolean);
  if (paths.length) sb.storage.from(ATTACH_BUCKET).remove(paths).catch(() => {});
}

async function loadAudienceData() {
  const [{ data: staff }, { data: userStores }, { data: stores }] = await Promise.all([
    sb.from('pgds_profiles').select('id, full_name, email').eq('role', 'staff').eq('status', 'approved').order('full_name', { ascending: true }),
    sb.from('pgds_user_stores').select('user_id, store_id'),
    sb.from('pgds_stores').select('id, store_number, store_name, active').order('store_number', { ascending: true })
  ]);
  return { staff: staff || [], userStores: userStores || [], stores: stores || [] };
}
function recipientsFor(post, targets, aud) {
  const staffIds = new Set(aud.staff.map(s => s.id));
  if (post.audience_type === 'all') return staffIds;
  const mine = targets.filter(t => t.post_id === post.id);
  const set = new Set();
  if (post.audience_type === 'users') mine.forEach(t => { if (t.user_id && staffIds.has(t.user_id)) set.add(t.user_id); });
  if (post.audience_type === 'stores') {
    const storeIds = new Set(mine.map(t => t.store_id).filter(Boolean));
    aud.userStores.forEach(r => { if (storeIds.has(r.store_id) && staffIds.has(r.user_id)) set.add(r.user_id); });
  }
  return set;
}

      <div id="audStores" class="store-picker" style="display:none;margin-top:8px;">
        ${aud.stores.filter(s => s.active !== false).map(s => `<label class="store-opt"><input type="checkbox" value="${s.id}"><span>${h(s.store_number)} - ${h(s.store_name)}</span></label>`).join('') || '<p style="font-size:13px;color:var(--muted);">No stores yet.</p>'}
      </div>
      <div id="audUsers" class="store-picker" style="display:none;margin-top:8px;">
        ${aud.staff.map(s => `<label class="store-opt"><input type="checkbox" value="${s.id}"><span>${h(s.full_name || s.email)}</span></label>`).join('') || '<p style="font-size:13px;color:var(--muted);">No approved staff yet.</p>'}
      </div>
    </div>
    <div class="form-group"><label>Attachments</label>${attachPickerHTML('postFiles')}</div>`}
    <div style="display:flex;gap:8px;margin-top:6px;">
      <button id="postSendBtn" onclick="submitPost(${post ? `'${post.id}'` : 'null'})">${post ? '💾 Save changes' : '📨 Send'}</button>
      <button class="secondary" onclick="closePopover()">Cancel</button>
    </div>`;
  document.body.appendChild(back); document.body.appendChild(pop);
  if (!post) onPostTypeChange();
}

function onPostTypeChange() {
  const v = (document.querySelector('input[name=postType]:checked') || {}).value;
  document.querySelectorAll('#postTypePicker .ptype').forEach(l => l.classList.toggle('active', l.querySelector('input').value === v));
  const ack = document.getElementById('postAck');
  if (ack && !ack.dataset.touched) ack.checked = (v === 'reminder' || v === 'urgent');
}
function onAudChange() {
  const v = (document.querySelector('input[name=postAud]:checked') || {}).value;
  const s = document.getElementById('audStores'), u = document.getElementById('audUsers');
  if (s) s.style.display = v === 'stores' ? 'block' : 'none';
  if (u) u.style.display = v === 'users' ? 'block' : 'none';
}

async function submitPost(editId) {
  const type = (document.querySelector('input[name=postType]:checked') || {}).value || 'message';
  const title = document.getElementById('postTitle').value.trim();
  const body = document.getElementById('postBody').value.trim();
  if (!title) return toast('Add a title.', 'warn');
  if (!body) return toast('Write a message.', 'warn');
  const fields = {
    type, title, body,
    due_date: document.getElementById('postDue').value || null,
    pinned: document.getElementById('postPinned').checked,
    require_ack: document.getElementById('postAck').checked,
    updated_at: new Date().toISOString()
  };
  const btn = document.getElementById('postSendBtn'); btn.disabled = true;
  try {
    if (editId) {
      const { error } = await sb.from('pgds_posts').update(fields).eq('id', editId);
      if (error) throw error;
      closePopover(); toast('✓ Announcement updated'); renderAdminView();
      return;
    }
    const audType = document.querySelector('input[name=postAud]:checked').value;
    const picked = audType === 'stores' ? Array.from(document.querySelectorAll('#audStores input:checked')).map(i => i.value)
      : audType === 'users' ? Array.from(document.querySelectorAll('#audUsers input:checked')).map(i => i.value) : [];
    if (audType !== 'all' && !picked.length) {
      btn.disabled = false;
      return toast(audType === 'stores' ? 'Tick at least one store.' : 'Tick at least one person.', 'warn');
    }
    btn.textContent = 'Sending...';
    const attachments = await uploadAttachments(document.getElementById('postFiles').files);
    const { data: post, error } = await sb.from('pgds_posts').insert({
      ...fields, audience_type: audType, attachments, author_id: currentUser.id, author_name: niceName()
    }).select().single();
    if (error) { removeAttachmentFiles(attachments); throw error; }
    if (picked.length) {
      const rows = picked.map(id => audType === 'stores' ? { post_id: post.id, store_id: id } : { post_id: post.id, user_id: id });
      const { error: tErr } = await sb.from('pgds_post_targets').insert(rows);
      if (tErr) { await sb.from('pgds_posts').delete().eq('id', post.id); removeAttachmentFiles(attachments); throw tErr; }
    }
    closePopover(); toast('📨 Announcement sent'); renderAdminView();
  } catch (err) {
    toast(err.message || String(err), 'error');
    const b = document.getElementById('postSendBtn');
    if (b) { b.disabled = false; b.textContent = editId ? '💾 Save changes' : '📨 Send'; }
  }
}

async function deletePost(id) {
  if (!confirm('Delete this announcement and all its replies? This cannot be undone.')) return;
  const [{ data: p }, { data: reps }] = await Promise.all([
    sb.from('pgds_posts').select('attachments').eq('id', id).single(),
    sb.from('pgds_post_replies').select('attachments').eq('post_id', id)
  ]);
  const { data: deleted, error } = await sb.from('pgds_posts').delete().eq('id', id).select('id');
  if (error) return toast(error.message, 'error');
  if (!deleted || !deleted.length) return toast('Nothing was deleted - permission denied.', 'error');
  removeAttachmentFiles([...((p && p.attachments) || []), ...(reps || []).flatMap(r => r.attachments || [])]);
  toast('Announcement deleted');
  annOpenPostId = null;
  renderAdminView();
}

function threadContainer() {
  return currentUser.role === 'admin' ? document.getElementById('content') : document.getElementById('staffPane');
}
function closePostThread() {
  if (currentUser.role === 'admin') { annOpenPostId = null; renderAdminView(); }
  else { msgOpenPostId = null; renderMessagesPane(); }
}
async function rerenderThread(postId, scrollToEnd) {
  const el = threadContainer(); if (!el) return;
  await renderPostThread(el, postId);
  if (scrollToEnd) { const c = document.querySelector('.reply-composer'); if (c) c.scrollIntoView({ block: 'end', behavior: 'smooth' }); }
}

async function renderPostThread(el, postId) {
  const isAdmin = currentUser.role === 'admin';
  el.innerHTML = '<p class="empty">Loading...</p>';
  const { data: p, error } = await sb.from('pgds_posts').select('*').eq('id', postId).maybeSingle();
  if (error || !p) {
    el.innerHTML = `<button class="secondary" onclick="closePostThread()" style="margin-bottom:12px;">← Back</button><div class="msg error">This post is no longer available.</div>`;
    return;
  }
  const [{ data: replies }, { data: myRead }] = await Promise.all([
    sb.from('pgds_post_replies').select('*').eq('post_id', postId).order('created_at', { ascending: true }),
    sb.from('pgds_post_reads').select('*').eq('post_id', postId).eq('user_id', currentUser.id).maybeSingle()
  ]);
  let read = myRead;
  if (!isAdmin && !read) {
    const now = new Date().toISOString();
    await sb.from('pgds_post_reads').upsert({ post_id: postId, user_id: currentUser.id, read_at: now }, { onConflict: 'post_id,user_id' });
    read = { read_at: now, acked_at: null };
    updateMsgUnread();
  }

  let ackBlock = '';
  if (!isAdmin && p.require_ack) {
    ackBlock = read && read.acked_at
      ? `<div class="ack-done">✅ You confirmed "Got it" on ${fmtDateTime(read.acked_at)}</div>`
      : `<button class="gold ack-btn" onclick="ackPost('${p.id}')">👍 Got it</button>`;
  }

  let ackPanel = '';
  if (isAdmin && p.require_ack) {
    const [aud, { data: tg }, { data: reads }] = await Promise.all([
      loadAudienceData(),
      sb.from('pgds_post_targets').select('*').eq('post_id', postId),
      sb.from('pgds_post_reads').select('*').eq('post_id', postId)
    ]);
    const rec = [...recipientsFor(p, tg || [], aud)];
    const staffById = {}; aud.staff.forEach(s => { staffById[s.id] = s; });
    const ackedIds = new Set((reads || []).filter(r => r.acked_at).map(r => r.user_id));
    const done = rec.filter(id => ackedIds.has(id)), waiting = rec.filter(id => !ackedIds.has(id));
    const nm = id => h(staffById[id] ? (staffById[id].full_name || staffById[id].email) : 'Unknown');
    ackPanel = `<div class="ack-panel">
      <div class="ack-head">✅ Got it: <strong>${done.length} of ${rec.length}</strong></div>
      <div class="ack-cols">
        <div><div class="ack-label">Confirmed</div>${done.map(id => `<span class="store-chip">${nm(id)}</span>`).join('') || '<span class="ack-none">No one yet</span>'}</div>
        <div><div class="ack-label">Waiting</div>${waiting.map(id => `<span class="store-chip waiting">${nm(id)}</span>`).join('') || '<span class="ack-none">Everyone confirmed</span>'}</div>
      </div>
    </div>`;
  }

  const t = POST_TYPES[p.type] || POST_TYPES.message;
  const reps = replies || [];
  window.__threadReplies = reps;
  el.innerHTML = `
    <button class="secondary" onclick="closePostThread()" style="margin-bottom:12px;">← Back to ${isAdmin ? 'announcements' : 'messages'}</button>
    <div class="post-full" style="border-top-color:${t.color};">
      <div class="post-card-top">${postTypeBadge(p.type)}${p.pinned ? '<span>📌 Pinned</span>' : ''}<span class="post-date">${fmtDateTime(p.created_at)}</span></div>
      <h2 class="post-full-title">${h(p.title)}</h2>
      <div class="post-author">From ${h(p.author_name || 'Signer')}${p.due_date ? ' · ' + dueChipHTML(p.due_date) : ''}</div>
      <div class="post-body">${h(p.body)}</div>
      ${attachmentsHTML(p.attachments)}
      ${ackBlock}
      ${isAdmin ? `<div class="post-admin-actions">
        <button class="secondary" onclick="openComposePost('${p.id}')">✏️ Edit</button>
        <button class="danger" onclick="deletePost('${p.id}')">🗑 Delete</button>
      </div>` : ''}
    </div>
    ${ackPanel}
    <div class="thread">
      <h3 class="thread-head">💬 Replies (${reps.length}) <span>Visible to everyone who received this post</span></h3>
      ${reps.map(r => replyHTML(r, isAdmin)).join('') || '<p class="empty" style="padding:16px;">No replies yet. Start the conversation.</p>'}
      <div class="reply-composer">
        <textarea id="replyBody" placeholder="Write a reply..." style="min-height:70px;"></textarea>
        <div class="reply-composer-actions">
          ${attachPickerHTML('replyFiles')}
          <button id="replySendBtn" onclick="sendReply('${p.id}')">Send reply</button>
        </div>
      </div>
    </div>`;
  hydrateAttachmentThumbs(el);
}

function replyHTML(r, isAdmin) {
  const mine = r.author_id === currentUser.id;
  const fromSigner = r.author_role === 'admin';
  const edited = r.updated_at && r.created_at && new Date(r.updated_at) - new Date(r.created_at) > 1000;
  return `<div class="reply ${mine ? 'mine' : ''} ${fromSigner ? 'signer' : ''}">
    <div class="reply-head">
      <span class="reply-avatar">${h((r.author_name || '?').trim().charAt(0).toUpperCase())}</span>
      <div>
        <div class="reply-name">${h(r.author_name || 'Staff')}${fromSigner ? '<span class="signer-tag">Signer</span>' : ''}</div>
        <div class="reply-sub">${r.author_label && !fromSigner ? h(r.author_label) + ' · ' : ''}${fmtDateTime(r.created_at)}${edited ? ' · edited' : ''}</div>
      </div>
    </div>
    ${r.body ? `<div class="reply-body">${h(r.body)}</div>` : ''}
    ${attachmentsHTML(r.attachments)}
    ${mine || isAdmin ? `<div class="reply-actions">
      ${mine ? `<button class="secondary" onclick="editReply('${r.id}','${r.post_id}')">✏️ Edit</button>` : ''}
      <button class="danger" onclick="deleteReply('${r.id}','${r.post_id}')">🗑 Delete</button>
    </div>` : ''}
  </div>`;
}

async function sendReply(postId) {
  const body = document.getElementById('replyBody').value.trim();
  const files = document.getElementById('replyFiles').files;
  if (!body && !(files && files.length)) return toast('Write a reply or attach a file.', 'warn');
  const btn = document.getElementById('replySendBtn'); btn.disabled = true; btn.textContent = 'Sending...';
  try {
    const attachments = await uploadAttachments(files);
    if (!body && !attachments.length) throw new Error('Nothing to send.');
    const { error } = await sb.from('pgds_post_replies').insert({
      post_id: postId, author_id: currentUser.id, author_name: niceName(),
      author_label: myAuthorLabel(), author_role: currentUser.role, body, attachments
    });
    if (error) { removeAttachmentFiles(attachments); throw error; }
    toast('✓ Reply sent');
    rerenderThread(postId, true);
  } catch (err) {
    toast(err.message || String(err), 'error');
    const b = document.getElementById('replySendBtn');
    if (b) { b.disabled = false; b.textContent = 'Send reply'; }
  }
}

function editReply(id, postId) {
  closePopover();
  const r = (window.__threadReplies || []).find(x => x.id === id);
  if (!r) return;
  const back = document.createElement('div'); back.className = 'popover-back'; back.onclick = closePopover;
  const pop = document.createElement('div'); pop.className = 'popover';
  pop.innerHTML = `
    <button class="popover-close" onclick="closePopover()">&times;</button>
    <h4>Edit reply</h4>
    <textarea id="editReplyBody" style="min-height:120px;">${h(r.body || '')}</textarea>
    <div style="display:flex;gap:8px;margin-top:10px;">
      <button onclick="saveReplyEdit('${id}','${postId}')">💾 Save</button>
      <button class="secondary" onclick="closePopover()">Cancel</button>
    </div>`;
  document.body.appendChild(back); document.body.appendChild(pop);
}
async function saveReplyEdit(id, postId) {
  const body = document.getElementById('editReplyBody').value.trim();
  const r = (window.__threadReplies || []).find(x => x.id === id);
  if (!body && !(r && (r.attachments || []).length)) return toast('A reply needs text or an attachment.', 'warn');
  const { error } = await sb.from('pgds_post_replies').update({ body, updated_at: new Date().toISOString() }).eq('id', id);
  if (error) return toast(error.message, 'error');
  closePopover(); toast('✓ Reply updated');
  rerenderThread(postId);
}
async function deleteReply(id, postId) {
  if (!confirm('Delete this reply?')) return;
  const r = (window.__threadReplies || []).find(x => x.id === id);
  const { data: deleted, error } = await sb.from('pgds_post_replies').delete().eq('id', id).select('id');
  if (error) return toast(error.message, 'error');
  if (!deleted || !deleted.length) return toast('Could not delete - permission denied.', 'error');
  removeAttachmentFiles(r && r.attachments);
  toast('Reply deleted');
  rerenderThread(postId);
}
async function ackPost(postId) {
  const now = new Date().toISOString();
  const { error } = await sb.from('pgds_post_reads').upsert(
    { post_id: postId, user_id: currentUser.id, read_at: now, acked_at: now }, { onConflict: 'post_id,user_id' });
  if (error) return toast(error.message, 'error');
  toast('👍 Marked as Got it');
  rerenderThread(postId);
}

async function renderMessagesPane() {

    .order('pinned', { ascending: false }).order('created_at', { ascending: false });
  if (error) return pane.innerHTML = `<div class="msg error">${h(error.message)}</div>`;

  const [rd, rp] = await Promise.all([
    ids.length ? sb.from('pgds_post_reads').select('post_id, acked_at').eq('user_id', currentUser.id).in('post_id', ids) : none,
    ids.length ? sb.from('pgds_post_replies').select('post_id').in('post_id', ids) : none
  ]);
  const readSet = new Set((rd.data || []).map(r => r.post_id));

  (rp.data || []).forEach(r => { replyCount[r.post_id] = (replyCount[r.post_id] || 0) + 1; });
  const unread = ids.filter(id => !readSet.has(id)).length;

    <div class="ann-toolbar">
      <div>
        <h3 style="margin:0;color:var(--green-900);">📢 Messages from the signer</h3>

      </div>
    </div>
    ${list.length ? `<div class="post-list">${list.map(p => postCardHTML(p, {
      unread: !readSet.has(p.id),
      replies: replyCount[p.id] || 0,
      ack: p.require_ack ? (ackSet.has(p.id) ? 'You confirmed' : 'Tap Got it to confirm') : '',
      onclick: `openPostStaff('${p.id}')`
    })).join('')}</div>` : '<p class="empty">No messages yet.</p>'}`;
  setMsgUnreadBadge(unread);
}
function openPostStaff(id) { msgOpenPostId = id; renderMessagesPane(); }

async function countUnreadMessages() {
  const { data: posts } = await sb.from('pgds_posts').select('id, type');
  const list = posts || [];
  if (!list.length) return { unread: [], total: 0 };
  const { data: reads } = await sb.from('pgds_post_reads').select('post_id').eq('user_id', currentUser.id).in('post_id', list.map(p => p.id));
  const readSet = new Set((reads || []).map(r => r.post_id));
  return { unread: list.filter(p => !readSet.has(p.id)), total: list.length };
}
async function updateMsgUnread() {
  if (!currentUser || currentUser.role === 'admin') return;
  const { unread } = await countUnreadMessages();
  setMsgUnreadBadge(unread.length);
}
function setMsgUnreadBadge(n) {
  const b = document.getElementById('msgUnread');
  if (b) b.textContent = n ? `(${n})` : '';
}

function getReminderStack() {
  let s = document.querySelector('.reminder-stack');
  if (!s) { s = document.createElement('div'); s.className = 'reminder-stack'; document.body.appendChild(s); }
  return s;
}
async function showMessageReminder() {
  try {
    if (sessionStorage.getItem('pgds_msg_reminded')) return;
    sessionStorage.setItem('pgds_msg_reminded', '1');
  } catch (e) {}
  const { unread } = await countUnreadMessages();
  if (!unread.length) return;
  const urgent = unread.filter(p => p.type === 'urgent').length;
  const el = document.createElement('div');

async function validateDoc(id) {
  if (!confirm('Confirm validation\n\nI have reviewed this document and it is complete and correct.\nIt will be sent to the Regional Manager for signing.')) return;
  const { data: updated, error } = await sb.from('pgds_documents').update({
    status: 'pending',
    validated_by: currentUser.id,
    validated_name: niceName(),
    validated_at: new Date().toISOString()
  }).eq('id', id).select('id');
  if (error) return toast(error.message, 'error');
  if (!updated || !updated.length) return toast('Could not validate - permission denied.', 'error');
  toast('✅ Validated and sent for signing');
  renderValidationPane();
}

async function returnDoc(id) {
  const reason = prompt('Why are you sending this back to the uploader?');
  if (reason === null) return;
  if (!reason.trim()) return toast('A reason is required.', 'warn');
  const { data: updated, error } = await sb.from('pgds_documents').update({
    status: 'returned',
    return_reason: reason.trim(),
    returned_by: currentUser.id,
    returned_at: new Date().toISOString()
  }).eq('id', id).select('id');
  if (error) return toast(error.message, 'error');
  if (!updated || !updated.length) return toast('Could not send back - permission denied.', 'error');
  toast('↩️ Sent back to the uploader');
  renderValidationPane();
}

function setValidationBadge(n) {

async function updateValidationCount() {

// Uploader resubmits a document the Area Manager sent back
async function resubmitDoc(id) {

  }).eq('id', id).select('id');

// ---------- TO-DO (private per staff) ----------
let todoFilter = 'active';
function localToday() {
  const d = new Date();
  return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
}
function fmtDue(s) {
  if (!s) return '';
  const [y, m, d] = s.split('-');
  return `${Number(m)}/${Number(d)}/${y}`;
}

async function renderTodoPane() {
  const pane = document.getElementById('staffPane'); if (!pane) return;
  const { data, error } = await sb.from('pgds_todos').select('*')
    .eq('user_id', currentUser.id)
    .order('done', { ascending: true })
    .order('due_date', { ascending: true, nullsFirst: false })
    .order('created_at', { ascending: false });
  if (error) return pane.innerHTML = `<div class="msg error">${h(error.message)}</div>`;
  const all = data || [];
  const today = localToday();
  const open = all.filter(t => !t.done);
  const dueToday = open.filter(t => t.due_date === today).length;
  const overdue = open.filter(t => t.due_date && t.due_date < today).length;
  const shown = all.filter(t => todoFilter === 'all' ? true : todoFilter === 'done' ? t.done : !t.done);
  pane.innerHTML = `
    <div class="privacy-note">
      <span class="privacy-icon">🔒</span>
      <div><strong>Your to-do list is private.</strong> Only you can see the tasks you add here. The signer and other staff cannot view, edit, or access them.</div>
    </div>
    <div class="kpi-row">
      <div class="kpi"><div class="label">Open tasks</div><div class="value">${open.length}</div><div class="sub">${all.length - open.length} completed</div></div>
      <div class="kpi gold"><div class="label">Due today</div><div class="value">${dueToday}</div><div class="sub">${fmtDue(today)}</div></div>
      <div class="kpi red"><div class="label">Overdue</div><div class="value">${overdue}</div><div class="sub">Past due date</div></div>
    </div>
    <div class="box">
      <h3>Add a task</h3>
      <form id="todoForm" class="todo-form">
        <input type="text" id="todoTitle" placeholder="e.g. Follow up Area Manager signature" maxlength="200">
        <input type="date" id="todoDue" title="Due date (optional)">
        <select id="todoPriority" title="Priority"><option value="low">Low</option><option value="normal" selected>Normal</option><option value="high">High</option></select>
        <button type="submit">➕ Add</button>
      </form>
    </div>
    <div class="todo-filters">
      ${['active', 'done', 'all'].map(f => `<button class="${todoFilter === f ? '' : 'secondary'}" onclick="setTodoFilter('${f}')">${f === 'active' ? 'Active' : f === 'done' ? 'Done' : 'All'}</button>`).join('')}
    </div>
    <div class="todo-list">
      ${shown.length ? shown.map(todoRowHTML).join('') : `<p class="empty">${todoFilter === 'done' ? 'No completed tasks yet.' : 'No tasks here. Add one above.'}</p>`}
    </div>`;
  document.getElementById('todoForm').onsubmit = addTodo;
}

function todoRowHTML(t) {
  const today = localToday();
  let due = '';
  if (t.due_date) {
    const cls = t.done ? 'due-done' : t.due_date < today ? 'due-over' : t.due_date === today ? 'due-today' : 'due-later';
    const label = t.done ? fmtDue(t.due_date) : t.due_date < today ? 'Overdue ' + fmtDue(t.due_date) : t.due_date === today ? 'Today' : 'Due ' + fmtDue(t.due_date);
    due = `<span class="due-chip ${cls}">${label}</span>`;
  }
  const prio = t.priority && t.priority !== 'normal' ? `<span class="badge ${t.priority}">${t.priority}</span>` : '';
  return `<div class="todo-row ${t.done ? 'done' : ''}">
    <input type="checkbox" ${t.done ? 'checked' : ''} onchange="toggleTodo('${t.id}', this.checked)" aria-label="Mark done">
    <div class="todo-main">
      <div class="todo-title">${h(t.title)}</div>
      <div class="todo-meta">${due}${prio}</div>
    </div>
    ${t.done ? '' : `<button class="secondary" onclick="editTodo('${t.id}')" title="Edit">✏️</button>`}
    <button class="danger" onclick="deleteTodo('${t.id}')" title="Delete">🗑</button>
  </div>`;
}

function setTodoFilter(f) { todoFilter = f; renderTodoPane(); }

async function addTodo(e) {
  e.preventDefault();
  const title = document.getElementById('todoTitle').value.trim();
  if (!title) return toast('Type a task first.', 'warn');

  const priority = document.getElementById('todoPriority').value;
  const { error } = await sb.from('pgds_todos').insert({ user_id: currentUser.id, title, due_date, priority });
  if (error) return toast(error.message, 'error');
  toast('✓ Task added');
  renderTodoPane();
}

async function toggleTodo(id, done) {
  const { error } = await sb.from('pgds_todos').update({ done, done_at: done ? new Date().toISOString() : null }).eq('id', id);
  if (error) return toast(error.message, 'error');
  renderTodoPane();
}

async function deleteTodo(id) {
  if (!confirm('Delete this task?')) return;
  const { error } = await sb.from('pgds_todos').delete().eq('id', id);
  if (error) return toast(error.message, 'error');
  toast('Task deleted');
  renderTodoPane();
}

async function editTodo(id) {
  closePopover();

  if (error || !t) return toast('Could not load task.', 'error');

  pop.innerHTML = `
    <button class="popover-close" onclick="closePopover()">&times;</button>
    <h4>Edit task</h4>
    <div class="form-group"><label>Task</label><input type="text" id="editTodoTitle" maxlength="200" value="${h(t.title)}"></div>
    <div class="row2">

      <div class="form-group"><label>Priority</label><select id="editTodoPriority">
        ${['low', 'normal', 'high'].map(p => `<option value="${p}" ${t.priority === p ? 'selected' : ''}>${p[0].toUpperCase() + p.slice(1)}</option>`).join('')}

async function saveTodoEdit(id) {

  }).eq('id', id);
  if (error) return toast(error.message, 'error');
  closePopover();

  renderTodoPane();

// Once per browser session, after a staff login: remind about due / overdue tasks
async function showTodoReminder() {
  try {
    if (sessionStorage.getItem('pgds_todo_reminded')) return;
    sessionStorage.setItem('pgds_todo_reminded', '1');
  } catch (e) {}
  const today = localToday();
  const { data } = await sb.from('pgds_todos').select('due_date')
    .eq('user_id', currentUser.id).eq('done', false)
    .not('due_date', 'is', null).lte('due_date', today);
  const list = data || [];
  if (!list.length) return;
  const overdue = list.filter(t => t.due_date < today).length;
  const dueToday = list.length - overdue;
  const parts = [];
  if (dueToday) parts.push(`${dueToday} task${dueToday > 1 ? 's' : ''} due today`);
  if (overdue) parts.push(`${overdue} overdue`);
  const el = document.createElement('div');
  el.className = 'todo-reminder';
  el.innerHTML = `<span>⏰ You have ${parts.join(' and ')}.</span>
    <button onclick="openTodoFromReminder()">View</button>
    <button class="close-x" onclick="this.parentElement.remove()" aria-label="Dismiss">&times;</button>`;
  getReminderStack().appendChild(el);
}
function openTodoFromReminder() {
  document.querySelectorAll('.todo-reminder:not(.msg-reminder)').forEach(e => e.remove());
  staffView = 'todo'; todoFilter = 'active';
  renderStaff();
}

// ---------- NOTES (private per staff) ----------
let notesSearch = '';
const NOTE_COLORS = { white: '#ffffff', yellow: '#fef3c7', green: '#d1fadf', blue: '#dbeafe', pink: '#fce7f3', purple: '#ede9fe' };

async function renderNotesPane() {
  const pane = document.getElementById('staffPane'); if (!pane) return;
  const { data, error } = await sb.from('pgds_notes').select('*')
    .eq('user_id', currentUser.id)
    .order('pinned', { ascending: false })
    .order('updated_at', { ascending: false });
  if (error) return pane.innerHTML = `<div class="msg error">${h(error.message)}</div>`;
  window.__pgdsNotes = data || [];
  pane.innerHTML = `
    <div class="privacy-note">
      <span class="privacy-icon">🔒</span>
      <div><strong>Your notes are private.</strong> Only you can see the notes you write here. The signer and other staff cannot view, edit, or access them.</div>
    </div>
    <div class="notes-toolbar">
      <input type="text" id="notesSearch" placeholder="Search notes" value="${h(notesSearch)}">
      <button onclick="openNoteEditor()">➕ New note</button>
    </div>
    <div id="notesGrid"></div>`;
  const s = document.getElementById('notesSearch');
  s.oninput = () => { notesSearch = s.value; drawNotesGrid(); };
  drawNotesGrid();
}

// Stronger accent per note color, used for the color-coded left border
const NOTE_ACCENTS = { white: '#94a3b8', yellow: '#f59e0b', green: '#10b981', blue: '#3b82f6', pink: '#ec4899', purple: '#8b5cf6' };
const notesExpanded = new Set();

function noteDateTime(n) {
  return new Date(n.updated_at || n.created_at).toLocaleString([], {
    month: 'numeric', day: 'numeric', year: 'numeric', hour: 'numeric', minute: '2-digit'
  });
}

// Table grouped by title: tap a title to expand every note saved under it
function drawNotesGrid() {
  const grid = document.getElementById('notesGrid'); if (!grid) return;
  const q = notesSearch.trim().toLowerCase();
  const list = (window.__pgdsNotes || []).filter(n => !q || (n.title || '').toLowerCase().includes(q) || (n.body || '').toLowerCase().includes(q));
  if (!list.length) {
    grid.innerHTML = `<p class="empty">${q ? 'No notes match your search.' : 'No notes yet. Tap New note to start.'}</p>`;
    return;
  }
  const map = new Map();
  list.forEach(n => {
    const key = (n.title || 'Untitled').trim().toLowerCase() || 'untitled';
    if (!map.has(key)) map.set(key, { key, title: (n.title || 'Untitled').trim() || 'Untitled', notes: [] });
    map.get(key).notes.push(n);
  });
  const groups = [...map.values()];
  groups.forEach(g => sortNotes(g.notes));
  groups.sort((a, b) =>
    (b.notes.some(n => n.pinned) - a.notes.some(n => n.pinned)) ||
    new Date(b.notes[0].updated_at || b.notes[0].created_at) - new Date(a.notes[0].updated_at || a.notes[0].created_at));
  window.__noteGroups = groups;
  // While searching, open every matching group so results are visible
  const isOpen = g => q ? true : notesExpanded.has(g.key);

  grid.innerHTML = `<table class="notes-table">
    <thead><tr><th style="width:170px;">Date &amp; time</th><th style="width:30%;">Title</th><th>Note</th></tr></thead>
    <tbody>
      ${groups.map((g, gi) => {
        const latest = g.notes[0];
        const accent = NOTE_ACCENTS[latest.color] || NOTE_ACCENTS.white;
        const bg = NOTE_COLORS[latest.color] || NOTE_COLORS.white;
        const open = isOpen(g);
        const pinned = g.notes.some(n => n.pinned);
        const head = `<tr class="note-group-row ${open ? 'open' : ''}" style="background:${bg};">
          <td class="note-dt" style="border-left:5px solid ${accent};">${noteDateTime(latest)}</td>
          <td>
            <button class="note-title-btn" onclick="toggleNoteGroup(${gi})" aria-expanded="${open}">
              <span class="note-caret">${open ? '▾' : '▸'}</span>${h(g.title)}
            </button>
            ${g.notes.length > 1 ? `<span class="note-count" style="background:${accent};">${g.notes.length}</span>` : ''}
            ${pinned ? '<span title="Pinned" style="margin-left:4px;">📌</span>' : ''}
          </td>
          <td class="note-preview">${open ? `<span style="color:var(--muted);font-size:12px;">${g.notes.length} note${g.notes.length > 1 ? 's' : ''}</span>` : h(latest.body || '')}</td>
        </tr>`;
        if (!open) return head;
        return head + g.notes.map(n => {
          const a = NOTE_ACCENTS[n.color] || NOTE_ACCENTS.white;
          return `<tr class="note-entry-row">
            <td class="note-dt" style="border-left:5px solid ${a};">${noteDateTime(n)}</td>
            <td><span class="note-color-dot" style="background:${a};"></span>${h(n.title || 'Untitled')}${n.pinned ? ' 📌' : ''}</td>
            <td>
              <div class="note-full">${h(n.body || '') || '<span style="color:var(--muted);">(no text)</span>'}</div>
              <div class="note-actions">
                <button class="secondary" onclick="openNoteEditor('${n.id}')">✏️ Edit</button>
                <button class="danger" onclick="deleteNote('${n.id}')">🗑 Delete</button>
              </div>
            </td>
          </tr>`;
        }).join('');
      }).join('')}
    </tbody>
  </table>`;
}

function toggleNoteGroup(i) {
  const g = (window.__noteGroups || [])[i];
  if (!g) return;
  if (notesExpanded.has(g.key)) notesExpanded.delete(g.key); else notesExpanded.add(g.key);
  drawNotesGrid();
}

function openNoteEditor(id) {
  closePopover();
  const n = id ? (window.__pgdsNotes || []).find(x => x.id === id) : null;
  const color = n ? (n.color || 'white') : 'white';
  const back = document.createElement('div'); back.className = 'popover-back'; back.onclick = closePopover;
  const pop = document.createElement('div'); pop.className = 'popover';
  pop.innerHTML = `
    <button class="popover-close" onclick="closePopover()">&times;</button>
    <h4>${n ? 'Edit note' : 'New note'}</h4>
    <input type="text" id="noteTitle" placeholder="Title" maxlength="120" value="${h(n ? n.title : '')}" style="margin-bottom:8px;">
    <textarea id="noteBody" placeholder="Write your note..." style="min-height:140px;">${h(n ? n.body : '')}</textarea>
    <div class="note-colors" id="noteColors">
      ${Object.entries(NOTE_COLORS).map(([k, v]) => `<span class="note-swatch ${k === color ? 'active' : ''}" data-color="${k}" style="background:${v}" title="${k}" onclick="pickNoteColor(this)"></span>`).join('')}
    </div>
    <label style="display:flex;gap:8px;align-items:center;font-size:13px;margin-top:10px;">
      <input type="checkbox" id="notePinned" style="width:auto;" ${n && n.pinned ? 'checked' : ''}> Pin to top
    </label>
    <div style="display:flex;gap:8px;margin-top:12px;flex-wrap:wrap;">
      <button onclick="saveNote(${n ? `'${n.id}'` : 'null'})">💾 Save</button>
      ${n ? `<button class="danger" onclick="deleteNote('${n.id}')">🗑 Delete</button>` : ''}
      <button class="secondary" onclick="closePopover()">Cancel</button>
    </div>`;
  document.body.appendChild(back); document.body.appendChild(pop);
  setTimeout(() => { const t = document.getElementById(n ? 'noteBody' : 'noteTitle'); if (t) t.focus(); }, 50);
}

function pickNoteColor(el) {
  document.querySelectorAll('#noteColors .note-swatch').forEach(s => s.classList.remove('active'));
  el.classList.add('active');
}

async function saveNote(id) {
  const title = document.getElementById('noteTitle').value.trim();
  const body = document.getElementById('noteBody').value.trim();
  if (!title && !body) return toast('Write something first.', 'warn');
  const active = document.querySelector('#noteColors .note-swatch.active');
  const row = {
    title, body,
    color: active ? active.dataset.color : 'white',
    pinned: document.getElementById('notePinned').checked,
    updated_at: new Date().toISOString()
  };
  // Ask the database to return the saved row so the list can update immediately
  const { data: saved, error } = id
    ? await sb.from('pgds_notes').update(row).eq('id', id).select().single()
    : await sb.from('pgds_notes').insert({ ...row, user_id: currentUser.id }).select().single();
  if (error) return toast(error.message, 'error');
  closePopover();
  upsertLocalNote(saved);
  toast(id ? '✓ Note updated' : '✓ Note saved');
}

function sortNotes(list) {
  return list.sort((a, b) =>
    (b.pinned === true) - (a.pinned === true) ||
    new Date(b.updated_at || b.created_at) - new Date(a.updated_at || a.created_at));
}

// Put a saved note into the on-screen list without waiting for a re-fetch
function upsertLocalNote(note) {
  if (!note) return renderNotesPane();
  const list = window.__pgdsNotes || [];
  const i = list.findIndex(n => n.id === note.id);
  if (i >= 0) list[i] = note; else list.unshift(note);
  window.__pgdsNotes = sortNotes(list);
  if (document.getElementById('notesGrid')) drawNotesGrid(); else renderNotesPane();
}

async function deleteNote(id) {
  if (!confirm('Delete this note?')) return;
  const { error } = await sb.from('pgds_notes').delete().eq('id', id);
  if (error) return toast(error.message, 'error');
  closePopover();
  window.__pgdsNotes = (window.__pgdsNotes || []).filter(n => n.id !== id);
  if (document.getElementById('notesGrid')) drawNotesGrid(); else renderNotesPane();
  toast('Note deleted');
}

function toggleMenu(e) {
  e.stopPropagation();

}

const STATUS_COLORS = { for_validation: '#8b5cf6', returned: '#f97316', pending: '#f59e0b', approved: '#10b981', rejected: '#dc2626' };

async function renderStaffDashboard() {
  const pane = document.getElementById('staffPane'); if (!pane) return;
  // RLS scopes this to the documents this position may see for their store(s)
  const { data, error } = await sb.from('pgds_documents')
    .select('id,title,status,created_at,signed_at,validated_at,store_number,store_name,urgency,doc_category');
  if (error) return pane.innerHTML = `<div class="msg error">${h(error.message)}</div>`;
  const all = data || [];
  const forValidation = all.filter(d => d.status === 'for_validation');
  const returned = all.filter(d => d.status === 'returned');
  const pending = all.filter(d => d.status === 'pending');
  const approved = all.filter(d => d.status === 'approved');
  const rejected = all.filter(d => d.status === 'rejected');
  const now = new Date();
  const sameDay = (a, b) => a.toDateString() === b.toDateString();
  const submittedToday = all.filter(d => sameDay(new Date(d.created_at), now)).length;
  const thisMonth = all.filter(d => { const x = new Date(d.created_at); return x.getMonth() === now.getMonth() && x.getFullYear() === now.getFullYear(); }).length;
  const oldestPending = pending.reduce((m, d) => Math.max(m, ageHours(d.created_at)), 0);
  const avgTurnaround = approved.length ? approved.reduce((s, d) => s + ageHours(d.created_at, d.signed_at), 0) / approved.length : 0;
  const pct = n => all.length ? (n / all.length * 100) : 0;

  // Group by document title / category
  const byTitle = {};
  all.forEach(d => {
    const label = (d.title || 'Untitled').trim() || 'Untitled';
    const key = label.toLowerCase();
    if (!byTitle[key]) byTitle[key] = { label, total: 0, pending: 0, approved: 0, rejected: 0 };
    byTitle[key].total++;
    byTitle[key][d.status] = (byTitle[key][d.status] || 0) + 1;
  });
  const titleRows = Object.values(byTitle).sort((a, b) => b.total - a.total);

  // Last 6 months of submissions
  const months = [];
  for (let i = 5; i >= 0; i--) {
    const d = new Date(now.getFullYear(), now.getMonth() - i, 1);
    months.push({ key: `${d.getFullYear()}-${d.getMonth()}`, label: d.toLocaleString([], { month: 'short' }), count: 0 });
  }
  const mIdx = {}; months.forEach((m, i) => { mIdx[m.key] = i; });
  all.forEach(d => {
    const x = new Date(d.created_at);
    const k = `${x.getFullYear()}-${x.getMonth()}`;
    if (mIdx[k] !== undefined) months[mIdx[k]].count++;
  });
  const maxMonth = Math.max(1, ...months.map(m => m.count));

  pane.innerHTML = `
    <div class="kpi-row">
      <div class="kpi blue"><div class="label">Total submitted</div><div class="value">${all.length}</div><div class="sub">${thisMonth} this month · ${submittedToday} today</div></div>
      <div class="kpi gold"><div class="label">For validation</div><div class="value">${forValidation.length}</div><div class="sub">Waiting for the Area Manager</div></div>
      <div class="kpi red"><div class="label">Returned</div><div class="value">${returned.length}</div><div class="sub">Needs fixing and resubmit</div></div>
      <div class="kpi gold"><div class="label">For signature</div><div class="value">${pending.length}</div><div class="sub">${oldestPending ? 'Oldest: ' + Math.floor(oldestPending) + 'h waiting' : 'All caught up'}</div></div>
      <div class="kpi"><div class="label">Approved</div><div class="value">${approved.length}</div><div class="sub">${all.length ? Math.round(pct(approved.length)) + '% of all' : 'None yet'}</div></div>
      <div class="kpi red"><div class="label">Rejected</div><div class="value">${rejected.length}</div><div class="sub">${all.length ? Math.round(pct(rejected.length)) + '% of all' : 'None yet'}</div></div>
      <div class="kpi blue"><div class="label">Avg turnaround</div><div class="value">${avgTurnaround.toFixed(1)}h</div><div class="sub">Upload → signature</div></div>
    </div>

    ${all.length ? `
    <div class="chart-box">
      <h3>📊 Status breakdown</h3>
      <div class="stack-bar">
        ${[['for_validation', forValidation.length], ['returned', returned.length], ['pending', pending.length], ['approved', approved.length], ['rejected', rejected.length]]
          .filter(([, n]) => n)
          .map(([s, n]) => `<div class="stack-seg" style="width:${pct(n)}%;background:${STATUS_COLORS[s]};" title="${DOC_STATUS[s].label}: ${n}"></div>`).join('')}
      </div>
      <div class="chart-legend">
        ${[['for_validation', forValidation.length], ['returned', returned.length], ['pending', pending.length], ['approved', approved.length], ['rejected', rejected.length]]
          .map(([s, n]) => `<span><i style="background:${STATUS_COLORS[s]}"></i> ${DOC_STATUS[s].label} <strong>${n}</strong> (${Math.round(pct(n))}%)</span>`).join('')}
      </div>
    </div>

    <div class="chart-box">
      <h3>📈 Documents submitted (last 6 months)</h3>
      <div class="bar-chart">
        ${months.map(m => `<div class="bar" style="height:${Math.max(4, m.count / maxMonth * 140)}px" title="${m.label}: ${m.count}"><span class="val">${m.count}</span><span class="lbl">${m.label}</span></div>`).join('')}
      </div>
      <div style="height:24px;"></div>
    </div>

    <div class="box">
      <h3>Documents by title / category</h3>
      <table><thead><tr><th>Title / category</th><th>Total</th><th>In progress</th><th>Approved</th><th>Rejected / returned</th><th class="title-mix">Mix</th></tr></thead><tbody>
        ${titleRows.map(r => `<tr>
          <td><strong>${h(r.label)}</strong></td>
          <td>${r.total}</td>
          <td>${(r.for_validation || 0) + (r.pending || 0)}</td>
          <td>${r.approved || 0}</td>
          <td>${(r.rejected || 0) + (r.returned || 0)}</td>
          <td class="title-mix"><div class="stack-bar sm">
            ${['for_validation','returned','pending','approved','rejected']
              .filter(s => r[s]).map(s => `<div class="stack-seg" style="width:${r[s] / r.total * 100}%;background:${STATUS_COLORS[s]};"></div>`).join('')}
          </div></td>
        </tr>`).join('')}
      </tbody></table>
    </div>` : '<p class="empty">No documents yet. Go to Add Docs for Signing to submit your first one.</p>'}`;
}

async function submitStoreRequest() {
  const picked = Array.from(document.querySelectorAll('#reqStorePicker input:checked'));
  if (!picked.length) return toast('Tick at least one store.', 'warn');
  const reason = (document.getElementById('reqReason') || {}).value || '';
  const { error } = await sb.from('pgds_store_requests').insert(
    picked.map(p => ({ user_id: currentUser.id, store_id: p.value, reason: reason.trim() || null }))
  );
  if (error) return toast(error.message, 'error');
  closePopover();
  toast(`📨 Request sent for ${picked.length} store(s)`);
  loadMyStoreRequests();
}

function handleFilePick(e) {
  const files = Array.from(e.target.files);
  for (const f of files) {
    const mb = f.size / 1048576;
    if (mb > MAX_FILE_MB) { alert(`${f.name} is too big (${mb.toFixed(1)}MB). Max ${MAX_FILE_MB}MB per file.`); continue; }
    selectedFiles.push(f);
  }
  e.target.value = '';
  updateFileList();
}
function updateFileList() {
  const list = document.getElementById('fileList');
  const drop = document.getElementById('fileDrop');
  const txt = document.getElementById('fileDropText');
  if (!selectedFiles.length) {
    list.innerHTML = ''; drop.classList.remove('has-file'); txt.textContent = 'Choose files or take a photo';
    return;
  }
  drop.classList.add('has-file');
  txt.textContent = `${selectedFiles.length} file(s) selected - they will be merged`;
  list.innerHTML = selectedFiles.map((f, i) => `<div class="file-item"><span>📄 ${h(f.name)} (${(f.size/1048576).toFixed(2)}MB)</span><span class="rm" onclick="removeFile(${i})">Remove</span></div>`).join('');

// Downscale + re-encode a photo so the resulting PDF stays small and fast to re-save.
// Documents stay perfectly readable at 2000px on the long edge.
async function compressImage(file, maxDim = 3000, quality = 0.9) {
  const bitmap = await createImageBitmap(file);
  const scale = Math.min(1, maxDim / Math.max(bitmap.width, bitmap.height));
  const w = Math.round(bitmap.width * scale), hgt = Math.round(bitmap.height * scale);
  const canvas = document.createElement('canvas');
  canvas.width = w; canvas.height = hgt;
  const ctx = canvas.getContext('2d');
  ctx.imageSmoothingQuality = 'high';
  ctx.drawImage(bitmap, 0, 0, w, hgt);
  bitmap.close && bitmap.close();
  const blob = await new Promise(r => canvas.toBlob(r, 'image/jpeg', quality));
  return { bytes: new Uint8Array(await blob.arrayBuffer()), width: w, height: hgt };
}

async function mergeFilesToPdf(files) {
  const pdfDoc = await PDFLib.PDFDocument.create();
  for (const f of files) {
    const ext = (f.name.split('.').pop() || '').toLowerCase();
    if (ext === 'pdf') {
      const buf = new Uint8Array(await f.arrayBuffer());
      const src = await PDFLib.PDFDocument.load(buf);
      const pages = await pdfDoc.copyPages(src, src.getPageIndices());
      pages.forEach(p => pdfDoc.addPage(p));
    } else {
      let img, iw, ih;
      try {
        const c = await compressImage(f);
        img = await pdfDoc.embedJpg(c.bytes); iw = c.width; ih = c.height;
      } catch (e) {
        // Fallback to the original bytes if canvas compression is unavailable
        const buf = new Uint8Array(await f.arrayBuffer());
        img = (['jpg','jpeg'].includes(ext) || f.type === 'image/jpeg') ? await pdfDoc.embedJpg(buf) : await pdfDoc.embedPng(buf);
        iw = img.width; ih = img.height;
      }
      const page = pdfDoc.addPage([iw, ih]);
      page.drawImage(img, { x: 0, y: 0, width: iw, height: ih });
    }
  }
  return await pdfDoc.save({ useObjectStreams: false });
}

async function handleUpload(e) {

  if (!notes) return toast('Add a brief explanation in Notes.', 'warn');
  const btn = document.getElementById('uploadBtn'); btn.disabled = true; btn.textContent = 'Uploading...';
  try {
    const pdfBytes = selectedFiles.length === 1 && selectedFiles[0].name.toLowerCase().endsWith('.pdf') ? new Uint8Array(await selectedFiles[0].arrayBuffer()) : await mergeFilesToPdf(selectedFiles);
    const path = `${currentUser.id}/${Date.now()}-${Math.random().toString(36).slice(2,8)}.pdf`;
    const up = await sb.storage.from('pgds-pending').upload(path, pdfBytes, { contentType: 'application/pdf' });

    const ins = await sb.from('pgds_documents').insert({
      uploader_id: currentUser.id,

      doc_category: catEl ? catEl.value : ((POSITIONS[myPosition()] || {}).category || 'admin'),
      title, notes, urgency, original_file_path: path, status: 'for_validation'
    });
    if (ins.error) { await sb.storage.from('pgds-pending').remove([path]); throw ins.error; }
    showMsg('uploadMsg', `Uploaded! ${selectedFiles.length} file(s) merged into one document. It is now waiting for Area Manager validation.`, 'success');

    selectedFiles = []; updateFileList();
    staffTab = 'pending';

}

// Make a safe, meaningful filename from a document title
function safeFileName(title, suffix = 'signed') {
  const base = String(title || 'document')
    .replace(/[^a-zA-Z0-9 _.-]/g, '')
    .replace(/\s+/g, ' ')
    .trim()
    .slice(0, 70) || 'document';
  return `${base} - ${suffix}.pdf`;
}

// Download straight to the device's Downloads folder (phone or PC)
async function downloadDirect(bucket, path, filename) {
  toast('Preparing download...');
  const { data, error } = await sb.storage.from(bucket).createSignedUrl(path, 300, { download: filename });
  if (error) return toast(error.message, 'error');
  try {
    const resp = await fetch(data.signedUrl);
    if (!resp.ok) throw new Error('HTTP ' + resp.status);
    const blob = await resp.blob();
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = filename;
    a.style.display = 'none';
    document.body.appendChild(a);
    a.click();
    setTimeout(() => { a.remove(); URL.revokeObjectURL(url); }, 3000);
    toast('⬇️ Saved to your Downloads folder');
  } catch (e) {
    // Fallback: the signed URL already carries Content-Disposition: attachment
    window.location.href = data.signedUrl;
  }
}

// In-app PDF/image viewer modal (never leaves the PWA)
async function openInAppViewer(bucket, path) {
  const { data, error } = await sb.storage.from(bucket).createSignedUrl(path, 300);
  if (error) return alert(error.message);
  const url = data.signedUrl;
  const modal = document.createElement('div');
  modal.className = 'modal';
  modal.id = 'viewerModal';
  const ext = (path.split('.').pop() || '').toLowerCase();
  const isImage = ['jpg','jpeg','png','gif','webp'].includes(ext);
  modal.innerHTML = `
    <div class="modal-topbar">
      <span class="title">👁️ ${h(path.split('/').pop())}</span>
      <div style="display:flex;gap:8px;">
        <button onclick="downloadDirect('${bucket}','${path}','${h(path.split('/').pop())}')">⬇️ Download</button>
        <button onclick="closeInAppViewer()">Close</button>
      </div>
    </div>
    <div class="modal-doc" id="viewerBody" style="padding:20px;">
      <p style="color:#fff">Loading...</p>
    </div>`;
  document.body.appendChild(modal);
  const body = document.getElementById('viewerBody');
  if (isImage) {
    body.innerHTML = `<img src="${url}" style="max-width:100%;height:auto;background:#fff;box-shadow:0 4px 12px rgba(0,0,0,.25);">`;
  } else {
    // Render PDF via PDF.js so it works reliably inside PWA
    try {
      const resp = await fetch(url);
      const buf = await resp.arrayBuffer();
      const pdf = await pdfjsLib.getDocument({ data: buf }).promise;
      body.innerHTML = '';
      const containerWidth = Math.max(320, body.clientWidth - 40);
      for (let i = 1; i <= pdf.numPages; i++) {
        const page = await pdf.getPage(i);
        const raw = page.getViewport({ scale: 1 });
        const scale = Math.min(1.6, containerWidth / raw.width);
        const viewport = page.getViewport({ scale });
        const canvas = document.createElement('canvas');
        canvas.className = 'pdf-page';
        canvas.style.width = viewport.width + 'px'; canvas.style.height = 'auto';
        canvas.style.maxWidth = '100%'; canvas.style.marginBottom = '12px';
        body.appendChild(canvas);
        const q = renderQuality(viewport.width, viewport.height, 1);
        const hiVp = page.getViewport({ scale: scale * q });
        canvas.width = Math.floor(hiVp.width); canvas.height = Math.floor(hiVp.height);
        await page.render({ canvasContext: canvas.getContext('2d'), viewport: hiVp }).promise;
      }
    } catch (err) {
      body.innerHTML = `<div class="msg error">Could not render: ${err.message}. <a href="${url}" target="_blank" style="color:#fff;">Open in new tab</a></div>`;
    }
  }
}

function closeInAppViewer() {
  const m = document.getElementById('viewerModal'); if (m) m.remove();
}

async function cancelDoc(id, path) {
  if (!confirm('Cancel this pending document? This cannot be undone.')) return;
  const { data: deleted, error } = await sb.from('pgds_documents').delete().eq('id', id).select('id');
  if (error) return toast(error.message, 'error');
  if (!deleted || !deleted.length) return toast('Could not cancel - permission denied.', 'error');
  try { await sb.storage.from('pgds-pending').remove([path]); } catch (e) {}
  toast('Document cancelled');
  loadMyDocs();
}

async function fetchStoreAssignments(userIds) {

    .select('user_id, pgds_stores(id, store_number, store_name)')

  (data || []).forEach(r => {
    if (!r.pgds_stores) return;
    (map[r.user_id] = map[r.user_id] || []).push(r.pgds_stores);
  });
  Object.values(map).forEach(list => list.sort((a, b) => String(a.store_number).localeCompare(String(b.store_number), undefined, { numeric: true })));
  return map;
}
